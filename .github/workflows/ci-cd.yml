name: CI/CD Pipeline
on:
  push:
    branches: [ "ci/setup", "main" ]
  pull_request:
    branches: [ "ci/setup", "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Executar Testes Unitários
        run: mvn test

      - name: Verificar Qualidade (Simulação)
        run: |
          echo "::warning::Verificando cobertura de código..."
          echo "Compilação iniciada com sucesso."

      - name: Build do Pacote (JAR)
        run: mvn package -DskipTests

      - name: Upload do Artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: devcalc-api-jar
          path: target/*.jar
          retention-days: 5

      - name: Gerar Relatório
        if: always()
        run: |
          echo "### Relatório de Build 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artefato:** Gerado com sucesso" >> $GITHUB_STEP_SUMMARY

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download do Artefato
        uses: actions/download-artifact@v4
        with:
          name: devcalc-api-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devcalc-api:latest

  deploy-production:
    needs: docker-build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_DOMAIN }}

    steps:
      - name: Checkout Manifesto K8s
        uses: actions/checkout@v4

      - name: Validar Variáveis de Ambiente
        run: |
          if [ -z "${{ vars.PROD_DOMAIN }}" ]; then
            echo "::error::Variável PROD_DOMAIN não definida!"
            exit 1
          fi
          echo "Deploying to domain: ${{ vars.PROD_DOMAIN }}"

      - name: Simulação de Deploy K8s
        run: |
          echo "Conectando ao Cluster Kubernetes..."
          echo "Aplicando deployment.yaml..."
          # Aqui entraria o comando kubectl real se tivéssemos um cluster na nuvem
          # Como é local, simulamos o sucesso para evidência
          echo "Deployment efetuado com sucesso na porta 8080."