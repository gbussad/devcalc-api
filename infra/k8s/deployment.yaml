apiVersion: apps/v1
kind: Deployment
metadata:
  name: devcalc-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devcalc-api
  template:
    metadata:
      labels:
        app: devcalc-api
    spec:
      containers:
        - name: devcalc-api
          image: gbussad/devcalc-api:latest
          ports:
            - containerPort: 8080